<style>

:root{

  --line:#d9e2ea;--blue:#0F4C81;--blue-dark:#0a355b;--green:#1E9E4A;--green-dark:#137a38;
  --green-soft:#e8f7ee;--amber:#fff7e5;--amber-line:#ecd9a6;

body{background:var(--bg);color:var(--ink);font-family:"Public Sans",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.font-display{font-family:"Sora","Public Sans",system-ui,sans-serif}
.field{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:11px 12px;outline:none;transition:.15s}
.field:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(15,76,129,.14)}
.field::placeholder{color:#98a8b7}
.label{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;display:block}
.proposal-table{width:100%;border-collapse:separate;border-spacing:0;overflow:hidden;border-radius:14px;border:1px solid var(--line);break-inside:avoid;page-break-inside:avoid}

.proposal-table td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:middle;font-size:14px;line-height:1.35}
.proposal-table tr:last-child td{border-bottom:0}
.proposal-doc{display:flex;flex-direction:column}
.proposal-doc>.proposal-body{display:flex;flex-direction:column;gap:14px;flex:1}
.proposal-total,.proposal-car,.proposal-how,.proposal-footer{break-inside:avoid;page-break-inside:avoid}

.mx-auto{margin-left:auto;margin-right:auto}.mx-4{margin-left:1rem;margin-right:1rem}
.mt-0\.5{margin-top:.125rem}.mt-1{margin-top:.25rem}.mt-2{margin-top:.5rem}.mt-3{margin-top:.75rem}.mt-4{margin-top:1rem}

.border-\[var\(--line\)\]{border-color:var(--line)}.border-\[var\(--amber-line\)\]{border-color:var(--amber-line)}
.bg-\[var\(--bg\)\]{background-color:var(--bg)}.bg-\[var\(--surface\)\]{background-color:var(--surface)}

.bg-\[var\(--green-soft\)\]{background-color:var(--green-soft)}.bg-\[var\(--amber\)\]{background-color:var(--amber)}
.bg-white{background-color:#fff}.overflow-hidden{overflow:hidden}
.text-center{text-align:center}.text-right{text-align:right}.text-justify{text-align:justify}

.text-\[var\(--green-dark\)\]{color:var(--green-dark)}.text-red-600{color:#dc2626}.text-green-100{color:#dcfce7}.text-green-50{color:#f0fdf4}.text-blue-100{color:#dbeafe}
.text-\[10px\]{font-size:10px}.text-\[11px\]{font-size:11px}.text-\[12px\]{font-size:12px}.text-\[13px\]{font-size:13px}
.text-\[14px\]{font-size:14px}.text-\[15px\]{font-size:15px}.text-\[16px\]{font-size:16px}.text-\[17px\]{font-size:17px}

@media (min-width:1024px){
  .lg\:grid-cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .lg\:grid-cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
  .lg\:px-8{padding-left:2rem;padding-right:2rem}
}
@media (max-width:640px){
  .proposal-table{border:0}.proposal-table thead{display:none}
  .proposal-table,.proposal-table tbody,.proposal-table tr,.proposal-table td{display:block;width:100%}
  .proposal-table tr{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
  .proposal-table td{border-top:0;padding:7px 12px}
  .proposal-table td:first-child{font-weight:700;background:var(--surface-2)}
  .proposal-table td::before{content:attr(data-label);display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-bottom:2px}
}
@media print{
  @page{size:A4;margin:10mm 11mm}
  body{background:#fff}
  .no-print{display:none !important}
  .print-clean{box-shadow:none !important;border:0 !important;max-width:none !important;margin:0 !important;border-radius:0 !important;overflow:visible !important}
  .proposal-doc{height:auto !important;min-height:0 !important}
  .proposal-doc>.proposal-body{padding:14px 0 0 !important;gap:12px !important}
  .proposal-table td{padding:7px 9px !important;font-size:13px !important}
  .proposal-table th{padding:7px 9px !important}
  .print-shell{padding:0 !important;background:#fff !important}
}

/* ========== FORMATAÇÃO E UTILIDADES ========== */
const fmtBRL = (v) =>
  new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL", maximumFractionDigits: 2 })
    .format(Number.isFinite(v) ? v : 0);

function U(v, fallback = 0) {
  if (v === "" || v === null || v === undefined) return fallback;
  const s = String(v).trim();
  if (s === "") return fallback;
  const n = Number(s.replace(",", "."));
  return Number.isFinite(n) ? n : fallback;
}

/* ========== ERROR BOUNDARY ========== */
class ErrorBoundary extends React.Component {
  constructor(p) { super(p); this.state = { erro: null }; }
  static getDerivedStateFromError(e) { return { erro: e }; }
  componentDidCatch(e, info) { console.error("Erro capturado:", e, info); }
  render() {
    if (this.state.erro) {
      return (
        <div style={{ padding: 24, fontFamily: "system-ui", maxWidth: 700, margin: "40px auto" }}>
          <h2 style={{ color: "#b91c1c", marginBottom: 12 }}>Algo deu errado ao renderizar a proposta</h2>
          <p style={{ marginBottom: 12 }}>Os seus dados não foram perdidos. Recarregue a página para continuar.</p>
          <pre style={{ background: "#f4f7f9", padding: 12, borderRadius: 8, overflow: "auto", fontSize: 12 }}>
            {String(this.state.erro && this.state.erro.message || this.state.erro)}
          </pre>
          <button onClick={() => location.reload()}
            style={{ marginTop: 16, padding: "10px 18px", background: "#0F4C81", color: "#fff", border: 0, borderRadius: 999, cursor: "pointer", fontWeight: 700 }}>
            Recarregar
          </button>
        </div>
      );
    }
    return this.props.children;
  }
}

              { key:"cidade", label:"Cidade / UF", placeholder:"Itapeva/SP", hint:"Cidade e estado onde fica o imóvel.", icon:<MapPin size={16}/>, inputMode:"text" },
              { key:"valorTotal", label:"Valor total do imóvel (R$)", placeholder:"125000", hint:"Valor cheio que o dono vai receber.", icon:<HandCoins size={16}/>, inputMode:"decimal" },
              { key:"pctCaixa", label:"% Financiado pela Caixa", placeholder:"80", hint:"Parte que o banco paga direto ao dono após a assinatura.", icon:<Landmark size={16}/>, inputMode:"decimal" },
              { key:"pctEntrada", label:"% Entrada do comprador", placeholder:"20", hint:"Livre — não trava em 100 − % Caixa. Ao mudar, o valor em R$ da entrada recalcula.", icon:<Percent size={16}/>, inputMode:"decimal" },
              { key:"valorEntrada", label:"Valor da entrada em R$ (editável)", placeholder:"25000", hint:"Ao mudar o R$, o % da entrada recalcula automaticamente.", icon:<HandCoins size={16}/>, inputMode:"decimal" },
              { key:"parcelas", label:"Nº de parcelas da entrada (1 a 24)", placeholder:"1", hint:"Quantas vezes o comprador vai dividir a entrada. Pode apagar — volta para 1.", icon:<Calculator size={16}/>, inputMode:"numeric" },
              { key:"corretor", label:"Nome do corretor / imobiliária", placeholder:"Renato Camargo", hint:"Quem assina a proposta e conversa com o dono.", icon:<FileText size={16}/>, inputMode:"text" },
              { key:"telefone", label:"Telefone / WhatsApp do corretor", placeholder:"(15) 99703-8249", hint:"Canal para o dono tirar dúvidas e responder.", icon:<Phone size={16}/>, inputMode:"tel" }
            ].map((c) => campoPainel(c.key, c.label, c.placeholder, c.hint, c.icon, c.inputMode))}
          </div>

          <div className="border-t border-[var(--line)] p-4 sm:p-6">
            <label className="flex cursor-pointer flex-col gap-3 rounded-2xl border border-[var(--line)] bg-[var(--surface-2)] p-4 sm:flex-row sm:items-center sm:justify-between">
              <span className="flex items-start gap-3">
                <span className="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-[var(--surface)] text-[var(--blue)] shadow-sm"><Car size={20}/></span>
                <span>
                  <span className="block font-display text-[15px] font-bold">Aceitar veículo como parte da entrada?</span>
                  <span className="mt-0.5 block text-xs leading-snug text-[var(--muted)]">Quando ligado, o valor do carro abate a entrada e só o restante é parcelado em dinheiro.</span>
                </span>
              </span>
              <span className="flex shrink-0 items-center gap-2">
                <span className="text-sm font-bold">{e.aceitarCarro ? "Sim" : "Não"}</span>
                <button type="button" role="switch" aria-checked={e.aceitarCarro} aria-label="Aceitar veículo como parte da entrada?"
                  onClick={() => alterarCarro(!e.aceitarCarro)}
                  className={`flex h-6 w-11 shrink-0 items-center rounded-full p-0.5 transition ${e.aceitarCarro ? "justify-end bg-[var(--green)]" : "justify-start bg-[var(--line)]"}`}>
                  <span className="block h-5 w-5 rounded-full bg-white shadow"></span>
                </button>
              </span>
            </label>

            {e.aceitarCarro && (
              <div className="mt-4">
                <div className="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">
                  <label className="block">
                    <span className="label">Marca / Modelo do carro</span>
                    <input className="field" value={e.carroModelo} onChange={(ev) => alterarCampo("carroModelo", ev.target.value)} placeholder="Ex.: Fiat Toro Freedom" aria-label="Marca / Modelo do carro" />
                  </label>
                  <label className="block">
                    <span className="label">Ano</span>
                    <input className="field" value={e.carroAno} onChange={(ev) => alterarCampo("carroAno", ev.target.value)} placeholder="2021" inputMode="numeric" aria-label="Ano do carro" />
                  </label>
                  <label className="block">
                    <span className="label">Placa (opcional)</span>
                    <input className="field" value={e.placa} onChange={(ev) => alterarCampo("placa", ev.target.value)} placeholder="Ex.: ABC-1234" aria-label="Placa do carro" />
                  </label>
                  <label className="block">
                    <span className="label">Valor avaliado do carro (R$)</span>
                    <input className="field" value={e.carroValor} onChange={(ev) => alterarCampo("carroValor", ev.target.value)} placeholder="75000" inputMode="decimal" aria-label="Valor avaliado do carro" />
                  </label>
                  <label className="block">
                    <span className="label">Quanto do carro abate na entrada (R$)</span>
                    <input className="field" value={e.carroAbate} onChange={(ev) => alterarCampo("carroAbate", ev.target.value)} placeholder="Igual ao valor avaliado" inputMode="decimal" aria-label="Quanto do carro abate na entrada" />
                  </label>
                  <label className="block">
                    <span className="label">Quem fica com custos de transferência?</span>
                    <select className="field" value={e.custoTransferencia} onChange={(ev) => alterarCampo("custoTransferencia", ev.target.value)} aria-label="Custos de transferência">
                      <option>Comprador</option>
                      <option>Vendedor</option>
                      <option>Dividido</option>
                    </select>
                  </label>
                </div>
                <label className="mt-4 block">
                  <span className="label">Texto de explicação do carro</span>
                  <textarea className="field min-h-[72px] resize-y" value={v.carro} onChange={(ev) => { setV((p) => ({...p, carro: ev.target.value})); setCopiado(false); setOkTextos(false); }} placeholder={carroTextoPadrao} aria-label="Texto de explicação do carro" />
                </label>
                {carroExcede && (
                  <div className="mt-4 flex items-start gap-2 rounded-xl border border-[var(--amber-line)] bg-[var(--amber)] px-4 py-3 text-sm font-semibold" role="alert">
                    <Warn size={18} className="mt-0.5 shrink-0" /> Valor do carro excede a entrada, diferença de {fmtBRL(carroExcedente)} deve ser negociada.
                  </div>
                )}
                <div className="mt-4 rounded-2xl bg-[var(--green)] p-4 text-white sm:p-5">
                  <div className="text-[11px] font-bold uppercase tracking-[0.12em] text-green-100">Se aceitar o carro</div>
                  <p className="mt-2 font-display text-[17px] font-bold leading-relaxed sm:text-lg">
                    Caixa {fmtBRL(valorCaixa)} + Dinheiro {fmtBRL(dinheiroRestante)} + Carro {fmtBRL(carroNaEntrada)} = {fmtBRL(totalRecebido)}
                    {!fecha ? ` — Diferença: ${fmtBRL(diferenca)}` : ""}
                  </p>
                  <p className="mt-1 text-sm text-green-50">
                    {modeloCarro}{anoCarro ? ` • ${anoCarro}` : ""}{placaCarro ? ` • Placa ${placaCarro}` : ""} • Valor avaliado {fmtBRL(carroValor)} • Entrada total {fmtBRL(valorEntrada)} • Transferência: {e.custoTransferencia}
                  </p>
                </div>
              </div>
            )}
          </div>

          <div className="grid grid-cols-3 divide-x divide-[var(--line)] border-t border-[var(--line)] bg-[var(--surface-2)] text-center">
            <div className="px-2 py-4">
              <div className="text-[11px] font-bold uppercase tracking-wider text-[var(--muted)]">Caixa</div>
              <div className="mt-1 font-display text-[15px] font-bold sm:text-lg">{fmtBRL(valorCaixa)}</div>
            </div>
            <div className="px-2 py-4">
              <div className="text-[11px] font-bold uppercase tracking-wider text-[var(--muted)]">{e.aceitarCarro ? "Entrada restante" : "Entrada"}</div>
              <div className="mt-1 font-display text-[15px] font-bold sm:text-lg">{fmtBRL(e.aceitarCarro ? dinheiroRestante : valorEntrada)}</div>
            </div>
            <div className="px-2 py-4">
              <div className="text-[11px] font-bold uppercase tracking-wider text-[var(--muted)]">{f === 1 ? "Parcela única" : "1ª parcela"}</div>
              <div className="mt-1 font-display text-[15px] font-bold text-[var(--green)] sm:text-lg">{fmtBRL(primeiraParcela)}</div>
            </div>
          </div>
        </section>

        <textarea ref={areaTexto} aria-hidden="true" tabIndex={-1} className="no-print absolute h-1 w-1 opacity-0" readOnly />

        <article className="proposal-doc print-clean overflow-hidden rounded-[20px] bg-[var(--surface)] shadow-[0_18px_50px_rgba(15,76,129,0.13)]">
          
          {/* CABEÇALHO COM LOGO E TÍTULO FORMATADO */}
          <div className="bg-white border-b-2 border-[var(--blue)] px-5 pt-6 pb-4 text-center sm:px-7 sm:pt-8 sm:pb-5">
            <div className="mb-3 flex justify-center">
              <img 
                src="https://i.ibb.co/3kR4V8B/logo-placeholder.png" 
                alt="R.C. Almeida - Soluções em Negócios Imobiliários" 
                className="h-16 w-auto sm:h-20 object-contain"
                onError={(ev) => { ev.target.style.display = 'none'; }} 
              />
            </div>
            <h2 className="font-display text-[20px] font-extrabold text-[var(--blue)] tracking-[0.1em] uppercase sm:text-[24px]"
                contentEditable={editTextos} suppressContentEditableWarning
                onBlur={(ev) => atualizarTexto("tituloDoc", ev.currentTarget.innerText)}>
              {tituloFinal}
            </h2>
            <p className="mt-1 text-[11px] font-semibold uppercase tracking-[0.18em] text-[var(--muted)]">Para aprovação do proprietário</p>
          </div>

          <div className="proposal-body px-5 py-4 sm:px-7 sm:py-5">
            <div>
              <p className="text-[14px] leading-snug text-justify"
                 contentEditable={editTextos} suppressContentEditableWarning
                 onBlur={(ev) => atualizarTexto("saudacao", ev.currentTarget.innerText)}>
                <strong>{saudacaoFinal}</strong>
              </p>
              <p className="mt-1 text-[14px] leading-snug text-justify text-[var(--muted)]"
                 contentEditable={editTextos} suppressContentEditableWarning
                 onBlur={(ev) => atualizarTexto("apresentacao", ev.currentTarget.innerText)}>
                {apresentacaoFinal}
              </p>
            </div>

            <div className="flex flex-col gap-2 rounded-xl border border-[var(--line)] bg-[var(--surface-2)] p-3 sm:flex-row sm:items-center sm:justify-between sm:gap-4 sm:px-4">
              <div className="min-w-0">
                <div className="text-[10px] font-bold uppercase tracking-[0.12em] text-[var(--muted)]">Imóvel • {e.condicao}</div>
                <p className="mt-0.5 font-display text-[16px] font-bold leading-snug sm:text-[17px]">{descricaoImovel}</p>
                {textoCaracteristicas && <p className="mt-1 text-[13px] font-semibold leading-snug text-[var(--ink)]">{textoCaracteristicas}</p>}
                {ehApto && valorCondominio > 0 && <p className="mt-0.5 text-xs text-[var(--muted)]">Condomínio: {fmtBRL(valorCondominio)}/mês — valor informativo, não entra no cálculo.</p>}
              </div>
              <div className="shrink-0 sm:min-w-[210px] sm:border-l sm:border-[var(--line)] sm:pl-4 sm:text-right">
                <div className="text-[10px] font-bold uppercase tracking-[0.12em] text-[var(--muted)]">Valor total do imóvel</div>
                <div className="font-display text-[26px] font-extrabold leading-none text-[var(--green)] sm:text-[30px]">{fmtBRL(valorTotal)}</div>
                <div className="mt-0.5 text-[11px] font-semibold text-[var(--muted)]">Pagamento conforme detalhamento abaixo</div>
              </div>
            </div>

            <div>
              <h3 className="mb-2 font-display text-[13px] font-bold uppercase tracking-wide">
                Detalhamento do pagamento
                {!somaOk && <span className="ml-2 rounded-full bg-[var(--amber)] px-2 py-0.5 text-[11px] font-bold normal-case tracking-normal">Soma em {somaPercentuais.toFixed(2).replace(/\.00$/, "").replace(".", ",")}% — confira</span>}
              </h3>
              <table className="proposal-table">
                <thead>
                  <tr>
                    <th>Descrição</th>
                    <th>Percentual</th>
                    <th>Valor</th>
                    <th>Condições</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td data-label="Descrição"><strong>Financiamento Caixa</strong></td>
                    <td data-label="Percentual"><strong>{pctCaixa}%</strong></td>
                    <td data-label="Valor"><strong>{fmtBRL(valorCaixa)}</strong></td>
                    <td data-label="Condições">{ehTerreno ? "Pago pela Caixa após assinatura" : "Pago pela Caixa após vistoria e assinatura"}</td>
                  </tr>
                  <tr>
                    <td data-label="Descrição"><strong>Entrada do comprador</strong></td>
                    <td data-label="Percentual"><strong>{pctEntrada}%</strong></td>
                    <td data-label="Valor"><strong>{fmtBRL(valorEntrada)}</strong></td>
                    <td data-label="Condições">{textoParcelasCurto}</td>
                  </tr>
                  {e.aceitarCarro && (
                    <React.Fragment>
                      <tr>
                        <td data-label="Descrição">
                          <strong>Veículo dado na negociação</strong>{" "}
                          <span className="font-normal text-[var(--muted)]">— {modeloCarro}{anoCarro ? ` • ${anoCarro}` : ""}{placaCarro ? ` • Placa ${placaCarro}` : ""}</span>
                        </td>
                        <td data-label="Percentual">—</td>
                        <td data-label="Valor"><strong>{fmtBRL(carroAbatido)}</strong> <span className="text-xs text-[var(--muted)]">(avaliado em {fmtBRL(carroValor)})</span></td>
                        <td data-label="Condições">Abate na entrada — Transferência: {e.custoTransferencia}</td>
                      </tr>
                      <tr>
                        <td data-label="Descrição"><strong>Entrada restante em dinheiro</strong></td>
                        <td data-label="Percentual">—</td>
                        <td data-label="Valor"><strong>{fmtBRL(dinheiroRestante)}</strong></td>
                        <td data-label="Condições">{textoParcelasCurto}</td>
                      </tr>
                    </React.Fragment>
                  )}
                </tbody>
              </table>
            </div>

            {e.aceitarCarro && (
              <section className="proposal-car flex flex-col gap-1.5 overflow-hidden rounded-xl border border-[var(--line)] px-3 py-2.5 sm:flex-row sm:items-center sm:gap-3 sm:px-4">
                <div className="flex shrink-0 items-center gap-2">
                  <Car size={17} className="text-[var(--blue)]" />
                  <h4 className="font-display text-[13px] font-bold">Veículo como parte do pagamento</h4>
                </div>
                <p className="flex-1 text-[13px] leading-snug text-justify"
                   contentEditable={editTextos} suppressContentEditableWarning
                   onBlur={(ev) => atualizarTexto("carro", ev.currentTarget.innerText)}>
                  {carroFinal}
                </p>
                {carroExcede && <p className="flex items-start gap-1.5 text-[12px] font-semibold" role="alert"><Warn size={15} className="mt-0.5 shrink-0" /> Excede a entrada em {fmtBRL(carroExcedente)} — diferença a negociar.</p>}
              </section>
            )}

            <div className="proposal-how flex items-start gap-2.5 rounded-xl bg-[var(--amber)] px-3 py-2.5 text-[13px] leading-snug">
              <Shield size={17} className="mt-0.5 shrink-0 text-[var(--blue)]" />
              <p className="text-justify"
                 contentEditable={editTextos} suppressContentEditableWarning
                 onBlur={(ev) => atualizarTexto("comoFunciona", ev.currentTarget.innerText)}>
                <strong>Como funciona:</strong> {comoFuncionaFinal}
              </p>
            </div>

            <div className="rounded-xl border border-[var(--line)] bg-[var(--surface-2)] px-3 py-2.5 text-[13px] leading-snug">
              <p className="text-justify">
                <strong>Conferência:</strong> Caixa {fmtBRL(valorCaixa)} + Entrada em dinheiro {fmtBRL(dinheiroRestante)}{e.aceitarCarro ? ` + Carro ${fmtBRL(carroNaEntrada)}` : ""} = <strong>{fmtBRL(totalRecebido)}</strong>{" "}
                {fecha
                  ? <span className="text-[var(--green-dark)] font-bold">— Fecha com o valor total.</span>
                  : <span className="font-bold text-red-600">— Diferença de {fmtBRL(diferenca)} em relação ao valor total de {fmtBRL(valorTotal)}.</span>}
              </p>
            </div>

            <div className="px-1 text-[12px] leading-snug text-[var(--muted)]"
                 contentEditable={editTextos} suppressContentEditableWarning
                 onBlur={(ev) => atualizarTexto("condicoes", ev.currentTarget.innerText)}>
              <strong className="text-[var(--ink)]">Condições gerais:</strong> {condicoesFinal.replace(/^Condições gerais:\s*/i, "")}
            </div>

            <div className="proposal-total flex flex-row items-center justify-between gap-3 rounded-xl bg-[var(--green)] px-4 py-3 text-white">
              <span className="font-display text-[13px] font-bold uppercase tracking-wide sm:text-[14px]"
                    contentEditable={editTextos} suppressContentEditableWarning
                    onBlur={(ev) => atualizarTexto("rotuloTotal", ev.currentTarget.innerText)}>
                {rotuloTotalFinal}
              </span>
              <span className="font-display text-[24px] font-extrabold leading-none sm:text-[28px]">{fmtBRL(valorTotal)}</span>
            </div>

            <footer className="proposal-footer flex flex-col gap-1 border-t border-[var(--line)] pt-3 sm:flex-row sm:items-center sm:justify-between sm:gap-4">
              <p className="text-[13px] leading-tight">
                <span className="mr-2 text-[10px] font-bold uppercase tracking-[0.12em] text-[var(--muted)]">Corretor / Imobiliária</span>
                <strong className="font-display text-[15px]">{e.corretor || "—"}</strong>
                <span className="text-[var(--muted)]"> — {e.telefone || "—"}</span>
              </p>
              <p className="shrink-0 text-[11px] leading-tight text-[var(--muted)] sm:text-right"
                 contentEditable={editTextos} suppressContentEditableWarning
                 onBlur={(ev) => atualizarTexto("rodape", ev.currentTarget.innerText)}>
                {rodapeFinal}
              </p>
            </footer>
          </div>
        </article>

        <p className={`${modoLimpo ? "hidden" : ""} no-print mt-4 text-center text-xs text-[var(--muted)]`}>
          Dica: use “Copiar texto para WhatsApp” para enviar a versão formatada, ou use “Versão limpa para impressão” e depois o menu do navegador para salvar em PDF.
        </p>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(
  <ErrorBoundary>
    <App />
  </ErrorBoundary>
);
</script>
</body>
</html>
