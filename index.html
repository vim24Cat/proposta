}

.shadow-\[0_18px_50px_rgba\(15\2c 76\2c 129\2c 0\.13\)\] {

:root{
  --bg:#eef2f5;
  --surface:#ffffff;
  --surface-2:#f4f7f9;
  --ink:#172433;
  --muted:#667788;
  --line:#d9e2ea;
  --blue:#0F4C81;
  --blue-dark:#0a355b;
  --green:#1E9E4A;
  --green-dark:#137a38;
  --green-soft:#e8f7ee;
  --amber:#fff7e5;
  --amber-line:#ecd9a6;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#0d151d;
    --surface:#14202c;
    --surface-2:#1a2a39;
    --ink:#edf3f7;
    --muted:#a7b8c7;
    --line:#2c3f50;
    --blue:#2b7ac2;
    --blue-dark:#0F4C81;
    --green:#2fbd5f;
    --green-dark:#1E9E4A;
    --green-soft:#173d27;
    --amber:#2d2a1c;
    --amber-line:#5a4f26;
  }
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"Public Sans",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

.font-display{
  font-family:"Sora","Public Sans",system-ui,sans-serif
}

input,select{
  font:inherit
}

.field{
  width:100%;
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--ink);
  border-radius:12px;
  padding:11px 12px;
  outline:none;
  transition:.15s
}

.field:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(15,76,129,.14)
}

.field::-moz-placeholder{
  color:#98a8b7
}

.field::placeholder{
  color:#98a8b7
}

.label{
  font-size:12px;
  font-weight:700;
  letter-spacing:.04em;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:6px;
  display:block
}

.proposal-table{
  width:100%;
  border-collapse:separate;
  border-spacing:0;
  overflow:hidden;
  border-radius:14px;
  border:1px solid var(--line);
  -moz-column-break-inside:avoid;
       break-inside:avoid;
  page-break-inside:avoid
}

.proposal-table th{
  background:var(--blue);
  color:#fff;
  text-align:left;
  padding:8px 10px;
  font-size:11px;
  line-height:1.25;
  letter-spacing:.05em;
  text-transform:uppercase
}

.proposal-table td{
  padding:8px 10px;
  border-top:1px solid var(--line);
  vertical-align:middle;
  font-size:14px;
  line-height:1.35
}

.proposal-table tr:last-child td{
  border-bottom:0
}

.proposal-doc{
  display:flex;
  flex-direction:column
}

.proposal-doc > .proposal-body{
  display:flex;
  flex-direction:column;
  gap:14px;
  flex:1
}

.proposal-total,.proposal-car,.proposal-how,.proposal-footer{
  -moz-column-break-inside:avoid;
       break-inside:avoid;
  page-break-inside:avoid
}

.proposal-footer{
  -moz-column-break-before:avoid;
       break-before:avoid;
  page-break-before:avoid
}

@media print{
  @page{
    size:A4;

    margin:10mm 11mm
  }

  body{
    background:#fff
  }

  .no-print{
    display:none !important
  }

  .print-clean{
    box-shadow:none !important;
    border:0 !important;
    max-width:none !important;
    margin:0 !important;
    border-radius:0 !important;
    overflow:visible !important
  }

  .proposal-doc{
    height:auto !important;
    min-height:0 !important
  }

  .proposal-doc > .proposal-body{
    padding:14px 0 0 !important;
    gap:12px !important
  }

  .proposal-table td{
    padding:7px 9px !important;
    font-size:13px !important
  }

  .proposal-table th{
    padding:7px 9px !important
  }

  .print-shell{
    padding:0 !important;
    background:#fff !important
  }
}

@media (max-width:640px){
  .proposal-table{
    border:0
  }

  .proposal-table thead{
    display:none
  }

  .proposal-table, .proposal-table tbody, .proposal-table tr, .proposal-table td{
    display:block;
    width:100%
  }

  .proposal-table tr{
    border:1px solid var(--line);
    border-radius:12px;
    margin-bottom:8px;
    overflow:hidden
  }

  .proposal-table td{
    border-top:0;
    padding:7px 12px
  }

  .proposal-table td:first-child{
    font-weight:700;
    background:var(--surface-2)

  .proposal-table td::before{
    content:attr(data-label);
    display:block;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--muted);
    font-weight:700;
    margin-bottom:2px
  }
